appId: com.antennadraw.desktop
productName: AntennaDraw
asar: true
directories:
  output: release
files:
  - desktop/*.cjs
  - package.json
extraResources:
  - from: backend
    to: backend
    filter:
      - desktop-entry.js
      - package.json
      - package-lock.json
      - src/**
      - '!src/native/**'
  - from: backend/node_modules
    to: backend/node_modules
    filter:
      - '**/*'
  - from: frontend/dist
    to: frontend
  - from: matlab
    to: matlab
    filter:
      - '*.m'
      - '!verify_*.m'
  - from: .desktop-build/demo
    to: demo
  - from: .desktop-build/build-info.json
    to: build-info.json
  - from: .desktop-build/native
    to: backend/src/native
    filter:
      - WindowsProcessHost.exe
      - WindowsProcessHost.manifest.json
  - from: .desktop-build/third-party
    to: third-party
win:
  target:
    - target: nsis
      arch: [x64]
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
artifactName: AntennaDraw-Setup-${version}-${arch}.${ext}
